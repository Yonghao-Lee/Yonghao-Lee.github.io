<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="alternate icon" type="image/png" href="./favicon-32.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Yonghao Lee — personal portfolio. Computer Science, machine learning, and software projects." />
    <meta name="theme-color" content="#181425" />
    <link rel="canonical" href="https://chicoryman.com/" />

    <!-- Set the theme before paint so there's no flash of the wrong colours. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme')
          if (t !== 'light' && t !== 'dark') {
            t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
          }
          document.documentElement.setAttribute('data-theme', t)
        } catch (e) {}
      })()
    </script>

    <!-- Open Graph (Facebook, LinkedIn, iMessage, Slack, …) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Yonghao Lee" />
    <meta property="og:url" content="https://chicoryman.com/" />
    <meta property="og:title" content="Yonghao Lee — Portfolio" />
    <meta property="og:description" content="Computer science student into math, machine learning, computer vision, and signal processing. Selected projects and links." />
